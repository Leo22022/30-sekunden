<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#121129">
  <!-- iPhone: über "Zum Home-Bildschirm" läuft die App im Vollbild, ohne Safari-Leisten -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="30 Sekunden">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235046e5'/><text x='50' y='68' text-anchor='middle' font-family='Georgia,serif' font-size='54' fill='%23f5f3ff'>30</text></svg>">
  <title>30 Sekunden</title>
  <!-- Dieselben zwei Schriften wie in der Schach-App. Ohne Netz springen Georgia und die Systemschrift ein. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Der jeweilige Bildschirm wird von app.js hier hineingeschrieben -->
  <main id="app"></main>
  <!-- Begriffe-Log, liegt über dem Spiel -->
  <div id="log-overlay" hidden></div>
  <script src="app.js"></script>
</body>
</html>
