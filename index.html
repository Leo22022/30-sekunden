<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#15131f">
  <!-- iPhone: über "Zum Home-Bildschirm" läuft die App im Vollbild, ohne Safari-Leisten -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="30 Sekunden">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
  <title>30 Sekunden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Der jeweilige Bildschirm wird von app.js hier hineingeschrieben -->
  <main id="app"></main>
  <!-- Begriffe-Log, liegt über dem Spiel -->
  <div id="log-overlay" hidden></div>
  <script src="app.js"></script>
</body>
</html>
