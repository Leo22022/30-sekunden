<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <!-- iPhone: über "Zum Home-Bildschirm" läuft die App im Vollbild, ohne Safari-Leisten -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="30 Sekunden">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235e5ce6'/><text x='50' y='68' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='50' fill='white'>30</text></svg>">
  <title>30 Sekunden</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <!-- Der jeweilige Bildschirm wird von app.js hier hineingeschrieben -->
  <main id="app"></main>
  <!-- Begriffe-Log, liegt über dem Spiel -->
  <div id="log-overlay" hidden></div>
  <!-- ?v=… bei jeder Veröffentlichung hochzählen: sonst zeigt das Handy noch die alte Fassung aus dem Zwischenspeicher -->
  <script src="app.js?v=8"></script>
</body>
</html>
