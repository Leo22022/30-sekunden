<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>30 Sekunden – Gerätetest</title>
  <style>
    /* Prüfseite für Haptik und Ton – gehört nicht zum Spiel */
    body {
      margin: 0;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      background: #000;
      color: #fff;
      font: 17px/1.35 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: -0.02em; }
    h2 { margin: 28px 16px 7px; font-size: 13px; font-weight: 400; text-transform: uppercase; color: rgba(235, 235, 245, 0.6); }
    p { margin: 0 0 8px; color: rgba(235, 235, 245, 0.6); }
    .gruppe { background: #1c1c1e; border-radius: 12px; overflow: hidden; }
    .gruppe > * { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 50px; padding: 8px 16px; box-sizing: border-box; }
    .gruppe > * + * { box-shadow: inset 0 0.5px 0 #38383a; }
    button { font: inherit; color: #7d7aff; text-align: left; background: none; border: 0; cursor: pointer; }
    button:active { opacity: 0.5; }
    b { font-weight: 600; color: #fff; }
    #status { padding: 12px 16px; background: #1c1c1e; border-radius: 12px; font-size: 15px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Gerätetest</h1>
  <p>Jede Zeile einmal antippen und merken, ob du etwas spürst bzw. hörst. Die Buchstaben bitte an Claude zurückmelden.</p>

  <h2>Haptik</h2>
  <div class="gruppe">
    <label><span><b>A</b> · Echter Schalter – von Hand umlegen</span><input type="checkbox" switch></label>
    <button data-test="b"><span><b>B</b> · Tick sofort beim Tippen</span></button>
    <button data-test="c"><span><b>C</b> · Tick 1 Sekunde nach dem Tippen</span></button>
    <button data-test="d"><span><b>D</b> · 5 Ticks im Sekundentakt</span></button>
  </div>

  <h2>Ton (Lautstärke aufdrehen)</h2>
  <div class="gruppe">
    <button data-test="e"><span><b>E</b> · Glocke sofort</span></button>
    <button data-test="f"><span><b>F</b> · Glocke nach 3 Sekunden</span></button>
    <button data-test="g"><span><b>G</b> · Glocke sofort, trotz Stummschalter</span></button>
  </div>

  <h2>Was das Gerät meldet</h2>
  <div id="status"></div>

  <script>
    const status = document.getElementById("status");
    const zeilen = [];
    function melde(text) {
      zeilen.push(text);
      status.textContent = zeilen.slice(-12).join("\n");
    }

    // Derselbe Umweg wie in der App: unsichtbaren iOS-Schalter anlegen und umlegen
    function tick() {
      if (navigator.vibrate) return navigator.vibrate(70);
      const label = document.createElement("label");
      label.style.display = "none";
      const schalter = document.createElement("input");
      schalter.type = "checkbox";
      schalter.setAttribute("switch", "");
      label.appendChild(schalter);
      document.head.appendChild(label);
      label.click();
      label.remove();
    }

    let audio = null;
    function tonBereit() {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state !== "running") audio.resume();
    }
    function glocke() {
      const t = audio.currentTime;
      for (const [frequenz, anteil] of [[880, 1], [1760, 0.5], [2640, 0.3]]) {
        const oszillator = audio.createOscillator();
        const lautstaerke = audio.createGain();
        oszillator.frequency.value = frequenz;
        lautstaerke.gain.setValueAtTime(0.0001, t);
        lautstaerke.gain.exponentialRampToValueAtTime(0.4 * anteil, t + 0.01);
        lautstaerke.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        oszillator.connect(lautstaerke).connect(audio.destination);
        oszillator.start(t);
        oszillator.stop(t + 1.7);
      }
      melde("Glocke gespielt – Zustand: " + audio.state);
    }

    const TESTS = {
      b() { tick(); melde("B ausgelöst"); },
      c() { setTimeout(() => { tick(); melde("C ausgelöst"); }, 1000); },
      d() { for (let i = 0; i < 5; i++) setTimeout(() => { tick(); melde("D Tick " + (i + 1)); }, 1000 * (i + 1)); },
      e() { tonBereit(); glocke(); },
      f() { tonBereit(); melde("F: Glocke kommt in 3 Sekunden …"); setTimeout(glocke, 3000); },
      g() {
        if (navigator.audioSession) navigator.audioSession.type = "playback";
        else melde("G: audioSession gibt es auf diesem Gerät nicht");
        tonBereit();
        glocke();
      },
    };
    document.addEventListener("click", (ereignis) => {
      const knopf = ereignis.target.closest("[data-test]");
      if (!knopf) return;
      try {
        TESTS[knopf.dataset.test]();
      } catch (fehler) {
        melde("Fehler bei " + knopf.dataset.test.toUpperCase() + ": " + fehler);
      }
    });

    melde("vibrate: " + (navigator.vibrate ? "ja" : "nein"));
    melde("audioSession: " + (navigator.audioSession ? "ja (" + navigator.audioSession.type + ")" : "nein"));
    melde("Wake Lock: " + (navigator.wakeLock ? "ja" : "nein"));
    melde("Als App gestartet: " + (navigator.standalone ? "ja" : "nein"));
    melde((navigator.userAgent.match(/OS [\d_]+|Version\/[\d.]+/g) || ["unbekannt"]).join(" · "));
  </script>
</body>
</html>
